[project]
name = "DNS-UpdaterA"
version = "2.0.0"
description = "A Python script to automate updating DNS record A type."
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "ovh==1.2.*",
    "python-dotenv==1.1.*",
    "requests==2.32.*",
]

[dependency-groups]
dev = [
    "mypy==1.18.*",
    "ruff==0.14.*",
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "ovh.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true